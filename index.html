<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>La Gitane — Système de gestion SDC</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0f0f0f;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;align-items:center;justify-content:center}.sdc-load{text-align:center;padding:24px}.dot{width:34px;height:34px;border:3px solid #333;border-top-color:#E8500A;border-radius:50%;margin:0 auto 14px;animation:s 0.8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.t{font-size:12px;color:#aaa;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="sdc-load"><div class="dot"></div><div class="t">Chargement SDC</div></div>
<script>
/*
  SDC AUTO-UPDATE BOOTSTRAP
  IMPORTANT POUR LES PROCHAINES MODIFICATIONS :
  - L'application complète se trouve dans /app.html.
  - Modifier app.html, pas ce fichier.
  - Ce bootstrap charge app.html avec une URL unique à chaque ouverture afin
    d'éviter qu'un raccourci mobile conserve une ancienne version en cache.
*/
(function () {
  var fresh = '/app.html?__sdc=' + Date.now();
  fetch(fresh, { cache: 'no-store', credentials: 'same-origin' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () {
      // Dernier recours : navigation directe avec cache-buster.
      window.location.replace(fresh);
    });
})();
</script>
</body>
</html>
